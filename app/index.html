<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12294a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arabic Study Kit">
  <title>Arabic Study Kit</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<header><div class="wrap heading"><div><p class="eyebrow">READ · RECALL · REMEMBER</p><h1>Arabic Study Kit</h1></div><button id="theme" aria-label="Toggle dark mode">Dark mode</button></div></header>
<main class="wrap">
  <section class="settings" aria-label="Study selection">
    <label id="course-label">Course<select id="course"></select></label>
    <div class="scope"><label>Scope<select id="scope"><option value="single">Only chapter</option><option value="range">Chapter range</option></select></label><div class="chapter-selects"><label id="from-label" hidden><span id="from-text">From</span><select id="from" aria-labelledby="from-text"></select></label><label><span id="chapter-label">Chapter</span><select id="chapter" aria-labelledby="chapter-label"></select></label></div></div>
  </section>
  <p id="loading" role="status">Loading your course…</p><div id="errors" role="status"></div>
  <nav aria-label="Study modes"><button data-mode="cards" aria-pressed="true">Flashcards</button><button data-mode="quiz" aria-pressed="false">Quiz</button><button data-mode="mistakes" aria-pressed="false">Mistakes <span id="mistake-count">0</span></button></nav>
  <section id="study" aria-label="Study area"></section>
  <section class="backup"><h2>Your progress</h2><p id="history"></p><p>iOS can clear local storage. Export your progress occasionally to keep a backup.</p><div class="actions"><button id="export">Export progress</button><label class="button" for="import">Import progress</label><input id="import" type="file" accept="application/json,.json" hidden></div><label>Import method<select id="import-method"><option value="merge">Merge with saved progress</option><option value="replace">Replace saved progress</option></select></label><p id="backup-status" role="status"></p></section>
</main>
<footer class="wrap"><p id="course-title"></p><p>Content: Beginner's Guide to Arabic Literacy, Dr. Islam Fekry</p><p id="offline-status" role="status"></p></footer>
</body></html>
